# Проект по втоматизации тестирования сайта [Русский букет](https://rus-buket.ru)

<p align="center">
  <img src="media/logo/rus-buket.svg" width="550" alt="rus-buket">
</p>

> Проект включает в себя UI-автотесты и ручные тесты для [сайта Русский букет](https://rus-buket.ru), с использованием современного стека технологий, интеграцией в CI/CD процессы и подключением отчётности.
